# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - BuzzCV

on:
  push:
    branches:
      - Buzzguard-_CV_Models
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Modified to cd into your specific deployment folder
      - name: Create and Start virtual environment and Install dependencies
        run: |
          cd CV_Buzz_Deployment
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # 📦 Modified to upload ONLY the contents of your deployment folder
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            CV_Buzz_Deployment/
            !CV_Buzz_Deployment/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_831D86169CD4493483C88EECBFE74756 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5B2499FD6F05496E8F52198B7B96FDB2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8F2C9E72923242D0ABCD89BADAEBC1C9 }}

      # 🚀 Modified to include the crash-prevention startup command
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'BuzzCV'
          slot-name: 'Production'
          startup-command: 'uvicorn API:app --host 0.0.0.0 --port 8000 --workers 1'
